name: LAB7_417477_test

on:
  push:
    branches:
      - roboczy

jobs:
  # Równoległe joby dla każdej z bazowych funkcji
  test_dodawanie:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: env_417477
      - name: Run test_dodawanie
        # Uruchomienie tylko funkcji test_dodawanie z pliku calculator_test.py
        run: pytest calculator_test.py::test_dodawanie # <--- ZMIENIONO!
        working-directory: env_417477

  test_odejmowanie:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: env_417477
      - name: Run test_odejmowanie
        # Uruchomienie tylko funkcji test_odejmowanie z pliku calculator_test.py
        run: pytest calculator_test.py::test_odejmowanie # <--- ZMIENIONO!
        working-directory: env_417477

  test_mnozenie:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: env_417477
      - name: Run test_mnozenie
        # Uruchomienie tylko funkcji test_mnozenie z pliku calculator_test.py
        run: pytest calculator_test.py::test_mnozenie # <--- ZMIENIONO!
        working-directory: env_417477

  test_dzielenie:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: env_417477
      - name: Run test_dzielenie
        # Uruchomienie tylko funkcji test_dzielenie z pliku calculator_test.py
        run: pytest calculator_test.py::test_dzielenie # <--- ZMIENIONO!
        working-directory: env_417477

  # Job dla nowych testów (ten plik testowy pozostaje oddzielny)
  new_tests:
    runs-on: ubuntu-latest
    needs: [test_dodawanie, test_odejmowanie, test_mnozenie, test_dzielenie]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: env_417477
      - name: Run new pandas tests
        run: pytest test_pandas_funkcje.py
        working-directory: env_417477